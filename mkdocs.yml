site_name: Diffusion / AIGC 面试课堂
site_description: 26 道高频题，8 章 26 节课，3 个综合练习
site_author: Diffusion / AIGC Course
site_url: https://your-domain.com/
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换暗色
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换亮色

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/ai-companion.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/ai-companion.js

nav:
  - 首页: index.md
  - 课程总览: course.md
  - 学习路径: syllabus.md
  - AI 伴读（可选）: ai-companion.md
  - 章节:
      - 第 0 章 导学: chapters/00-orientation.md
      - 第 1 章 扩散模型基础: chapters/01-foundations.md
      - 第 2 章 采样、加速与引导: chapters/02-sampling-guidance.md
      - 第 3 章 Latent Diffusion 与 SD: chapters/03-latent-sd.md
      - 第 4 章 条件控制与个性化: chapters/04-conditioning-personalization.md
      - 第 5 章 模型演进与系统对比: chapters/05-model-evolution.md
      - 第 6 章 评估、失败模式与面试实战: chapters/06-evaluation-interview.md
      - 第 7 章 综合练习与面试答辩: chapters/07-capstone.md
  - 第 1 章完整讲义:
      - 材料包总览: lessons/ch01/README.md
      - 1.1 生成模型全景与扩散直觉: lessons/ch01/01-生成模型全景与扩散直觉.md
      - 1.2 前向过程与噪声日程: lessons/ch01/02-前向过程与噪声日程.md
